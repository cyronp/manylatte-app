version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      compatible-updates:
        patterns:
          - '*'
        exclude-patterns:
          - 'prisma'
          - '@prisma/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-updates:
        patterns:
          - '*'
